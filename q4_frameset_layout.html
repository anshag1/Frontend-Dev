<!DOCTYPE html>
<!-- Question 4: Frameset with navigation and welcome message -->
<html>
<head>
  <title>Frameset Example</title>
</head>
<frameset rows="30%,70%">
  <frame srcdoc="<h3>Home | About | Contact</h3>" title="Navigation">
  <frame srcdoc="<p>Welcome to My Website</p>" title="Main Content">
</frameset>
</html>
