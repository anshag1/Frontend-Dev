<!DOCTYPE html>
<!-- Question 9: File upload form for jpg/png only -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>File Upload Form</title>
</head>
<body>
  <form>
    <input type="file" accept=".jpg,.png" required><br>
    <p>Only .jpg and .png image files are allowed.</p>
  </form>
</body>
</html>
