    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Q8 - Dynamic Blog Posts</title>
      <link rel="stylesheet" href="styles.css">
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>
    <body class="container">
    <h1>Q8 - Dynamic Blog Posts</h1>
    <section class="card" id="blog">
  <h2>Blog Posts</h2>
  <div>
    <button id="addPost" class="btn">Add New Post</button>
    <button id="prependPost" class="btn">Prepend Featured Post</button>
    <button id="removeLast" class="btn">Remove Last Post</button>
  </div>
  <div id="posts">
    <div class="post">First post about JS</div>
    <div class="post">Second post about CSS</div>
    <div class="post">Third post about HTML</div>
    <div class="post">Fourth post about Accessibility</div>
    <div class="post">Fifth post about Performance</div>
  </div>
</section>

    <script src="q8.js"></script>
    </body>
    </html>
