<!doctype html><html><head><meta charset="utf-8"><title>Q8 Custom Dropdown</title>
<link rel="stylesheet" href="styles.css"></head><body class="container">
<h2>Q8 - Custom Dropdown</h2>
<div class="dropdown" id="dd">
  <button id="ddBtn" class="btn">Select option</button>
  <div class="list" id="ddList" role="menu">
    <div class="opt btn" data-val="One">One</div>
    <div class="opt btn" data-val="Two">Two</div>
    <div class="opt btn" data-val="Three">Three</div>
  </div>
</div>
<script src="q8.js"></script>
</body></html>
