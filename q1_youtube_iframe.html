<!DOCTYPE html>
<!-- Question 1: Embed a YouTube video using iframe (responsive using percentage sizes) -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>YouTube Video Embed</title>
</head>
<body>
  <h2>My Favorite YouTube Video</h2>
  <iframe width="80%" height="45%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube Video" allowfullscreen></iframe>
</body>
</html>
