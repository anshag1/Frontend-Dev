    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Q1 - Welcome Greeting</title>
      <link rel="stylesheet" href="styles.css">
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>
    <body class="container">
    <h1>Q1 - Welcome Greeting</h1>
    <section class="card" id="welcomeCard" aria-label="Welcome section">
  <h2 id="greeting">Hello!</h2>
  <p id="welcomeMsg">Welcome to our site.</p>
  <button id="changeGreeting" class="btn">Change Greeting</button>
  <button id="toggleWelcome" class="btn">Toggle Welcome Message</button>
  <button id="showTime" class="btn">Show Current Time</button>
  <p>Click greeting to see alert.</p>
</section>

    <script src="q1.js"></script>
    </body>
    </html>
