<!doctype html><html><head><meta charset="utf-8"><title>Q9 Form Validation</title>
<link rel="stylesheet" href="styles.css"></head><body class="container">
<h2>Q9 - Form submit blocker with live errors</h2>
<form id="f">
  <label>Name: <input name="name" required></label><div class="err" id="errName"></div>
  <label>Email: <input name="email" required></label><div class="err" id="errEmail"></div>
  <label>Password: <input name="password" type="password" required></label><div class="err" id="errPwd"></div>
  <button class="btn">Submit</button>
</form>
<div id="msg" class="hidden"></div>
<script src="q9.js"></script>
</body></html>
