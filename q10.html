    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Q10 - Registration Form Validation</title>
      <link rel="stylesheet" href="styles.css">
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>
    <body class="container">
    <h1>Q10 - Registration Form Validation</h1>
    <section class="card" id="reg">
  <h2>Registration Form</h2>
  <form id="regForm" novalidate>
    <label>Name: <input name="name" id="name"></label><br>
    <label>Email: <input name="email" id="email"></label><br>
    <label>Password: <input name="password" id="password" type="password"></label><br>
    <button class="btn" id="submitBtn">Register</button>
  </form>
  <div id="msg"></div>
</section>

    <script src="q10.js"></script>
    </body>
    </html>
